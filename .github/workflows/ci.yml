name: CI

on:
  push:
    branches: [main]
    # зміни лише в текстах і картинках не потребують тестів на трьох системах
    paths-ignore:
      - "ROADMAP.md"
      - "RELEASING.md"
      - "README*.md"
      - "LICENSE"
      - "THIRD_PARTY_LICENSES.md"
      - "docs/img/**"
      - "docs/release-notes/**"
  pull_request:

# новий пуш скасовує ще не завершену перевірку попереднього — менше зайвих запусків
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install . pytest pytest-asyncio
      - name: Tests (demo mode, no sound)
        run: python -m pytest -q tests

  site:
    # Сайт (docs/) збирається з CHANGELOG.md і docs/*/troubleshooting.md:
    # якщо їх змінили, а сайт не перезібрали (python tools/build_site.py) — нагадати.
    name: Website is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pillow markdown
      - run: python tools/build_site.py
      - name: Compare
        run: |
          git diff --stat -- 'docs/*.html' 'docs/**/*.html' docs/sitemap.xml
          git diff --quiet -- 'docs/*.html' 'docs/**/*.html' docs/sitemap.xml || {
            echo "::error::Run 'python tools/build_site.py' and commit the website (docs/)."; exit 1; }
