# Налаштування окремого вікна Kitty для Платівки.
# Використовується лише для вікна плеєра — ваш власний kitty.conf не зачіпається.

remember_window_size  no
initial_window_width  122c
initial_window_height 34c
window_padding_width  4

font_size 13.0
cursor_blink_interval 0
enable_audio_bell no
confirm_os_window_close 0
tab_bar_min_tabs 2
# Компактний вигляд Платівки змінює висоту свого вікна (згорнути/розгорнути).
# Дозволено лише це одне: зміну розміру вікна, і лише з самого вікна плеєра.
allow_remote_control password
remote_control_password "" resize-os-window
shell_integration disabled
update_check_interval 0

# Колір рамки вікна під світлу тему плеєра (сам плеєр малює свій фон)
background #ECEFF4
foreground #1A2030

# macOS: закрили вікно — закрилась програма, Option працює як Alt
macos_quit_when_last_window_closed yes
macos_option_as_alt yes
macos_show_window_title_in window
