[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "plativka"
version = "1.6.1"
description = "A Winamp-style terminal music player for macOS, Linux and Windows"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dkindratyuk-web" }]
requires-python = ">=3.9"
dependencies = [
    "textual>=1.0",
    "mutagen>=1.45",
    "pillow>=9.0",
    "textual-image>=0.8",
    "segno>=1.5",
    "Send2Trash>=1.8",
    "certifi>=2023.7",
    "dbus-next>=0.2.3; sys_platform == 'linux'",
    "pystray>=0.19; sys_platform == 'win32'",
    "pycaw>=20230407; sys_platform == 'win32'",
    "comtypes>=1.2; sys_platform == 'win32'",
    "winrt-runtime>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Playback>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=2.0; sys_platform == 'win32'",
    "winrt-Windows.UI.Notifications>=2.0; sys_platform == 'win32'",
    "winrt-Windows.Data.Xml.Dom>=2.0; sys_platform == 'win32'",
]
keywords = ["music", "player", "terminal", "tui", "winamp", "mpv"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]

[project.urls]
Homepage = "https://github.com/dkindratyuk-web/plativka"
Issues = "https://github.com/dkindratyuk-web/plativka/issues"

[project.optional-dependencies]
# віконна версія (Qt): pip install "plativka[desktop]"
desktop = ["PySide6-Essentials>=6.6", "qasync>=0.27",
           "pyobjc-framework-UserNotifications>=10; sys_platform == 'darwin'",
           "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'"]

[project.scripts]
plativka = "plativka.app:main"
plativka-desktop = "plativka.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
plativka = ["assets/*"]
